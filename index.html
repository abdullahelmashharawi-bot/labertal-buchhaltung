<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f63c6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Labertal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Labertal Buchhaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: feste Seitenleiste links (auf dem Handy unten), Arbeitsfläche rechts; Editoren als Blatt von rechts */
:root{
  --bg:#f2f4f8; --panel:#ffffff; --ink:#151c28; --muted:#5b6677; --line:#e1e6ee;
  --accent:#1f63c6; --accent-ink:#ffffff; --amber:#e9a12e;
  --good:#1f8a4c; --warn:#b86e00; --bad:#c23b31; --chip:#eef2f7;
  --display:"Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --radius:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161e; --panel:#19202b; --ink:#e6ebf2; --muted:#97a3b4; --line:#2a3443;
    --accent:#5a9bf0; --accent-ink:#0b1220; --amber:#f0b44f;
    --good:#4cc07f; --warn:#e3a33c; --bad:#ef6a5f; --chip:#232c39; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161e; --panel:#19202b; --ink:#e6ebf2; --muted:#97a3b4; --line:#2a3443;
  --accent:#5a9bf0; --accent-ink:#0b1220; --amber:#f0b44f;
  --good:#4cc07f; --warn:#e3a33c; --bad:#ef6a5f; --chip:#232c39; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
main{min-width:0}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font-family:var(--display);font-size:18px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--chip)}
nav.side a.on{background:var(--accent);color:var(--accent-ink)}
nav.side a .badge{background:var(--amber);color:#1b1300;border-radius:99px;font-size:12px;padding:0 7px;font-weight:600}
nav.side .spacer{flex:1}
main{padding:calc(24px + env(safe-area-inset-top)) clamp(16px,3vw,36px) 80px;max-width:1240px;width:100%}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.head h1{flex:1}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.list,.tbl-wrap,.stat,.morelist a,.todo a{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn{transition:background .15s,border-color .15s,transform .05s}.btn:active{transform:scale(.97)}
.only-m{display:none}
#pdfv{display:none;position:fixed;inset:0;z-index:200;background:#3b3f46;flex-direction:column}
#pdfv.open{display:flex}
body.pv-on{overflow:hidden}
.pv-bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.pv-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pv-zoom{display:flex;align-items:center;gap:4px}.pv-zoom span{min-width:46px;text-align:center;font-size:13px;color:var(--muted)}
.pv-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:10px 0 calc(20px + env(safe-area-inset-bottom))}
.pv-pages{width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px}
.pv-page{width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);border-radius:2px}
.pv-load{color:#fff;padding:40px;text-align:center}
@media (max-width:820px){.pv-bar .btn.sm{padding:7px 10px}.pv-bar [data-act=pvSave]{font-size:13px}}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile .lbl{color:var(--muted);font-size:13px}
.tile .big{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13px}
.tile a{text-decoration:none;color:inherit;display:block}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--panel)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > span{font-weight:500}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.form .wide{grid-column:1/-1}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;background:var(--panel);cursor:pointer}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.drop b{font-family:var(--display);font-size:19px}
/* Sheet (Editor) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;z-index:20}
.sheet-bg.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;visibility:hidden}
.sheet.open{transform:none;visibility:visible;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-head{display:flex;gap:10px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-head h2{flex:1}
.sheet-body{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;flex:1}
.sheet-body>*{flex:none;min-width:0;max-width:100%}
.items td{padding:6px 6px}
.items input,.items select{padding:6px 8px}
.items .desc{min-width:220px}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 24px;justify-content:end;font-variant-numeric:tabular-nums}
.totals .g{font-weight:700;font-size:17px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.preview img,.preview canvas{max-width:100%;height:auto;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:40;display:none;max-width:90vw}
.toast.show{display:block}
.note{border-left:4px solid var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--panel));padding:10px 14px;border-radius:6px}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.kz{font-family:var(--display);font-weight:700;color:var(--accent)}
.bar-chart{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.copy{cursor:pointer;border-bottom:1px dashed var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- App-Oberfläche ---- */
.card{box-shadow:0 1px 2px rgba(20,30,50,.04)}
.btn{border-radius:12px;min-height:40px}
.btn.big{min-height:54px;font-size:17px;padding:12px 20px;border-radius:14px;justify-content:center}
.side-cta{margin:4px 4px 14px;justify-content:center}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.hello h1{font-size:30px}
.hello .muted{font-size:14px}
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:16px}
.hero button{font:inherit;border:0;border-radius:var(--radius);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.hero button b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.hero button span{font-size:13px;color:var(--muted)}
.hero button.main{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#0b2a66));color:#fff;border:0}
.hero button.main span{color:rgba(255,255,255,.85)}
.hero svg{width:30px;height:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:inherit;display:block}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.sec h2{font-size:20px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
.li:hover{background:var(--chip)}
.li .t{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.li .a .chip{margin-top:3px}
.li > div{min-width:0}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--muted);flex:none;overflow:hidden}
.ic svg{width:22px;height:22px}
.ic img{width:100%;height:100%;object-fit:cover}
.pchk-list{display:grid;gap:2px}.pchk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.pchk>span{flex:1;min-width:200px;font-size:14px}.pchk>div{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pchk .btn.on.ok{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:var(--good);color:var(--good)}.pchk .btn.on.nok{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border-color:var(--bad);color:var(--bad)}.pchk .btn.on.na{background:var(--chip)}
.plim{min-height:14px}.plim small{font-size:11.5px;font-weight:500}.pcirc{margin-top:10px}
.pphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}.pphoto{display:grid;gap:4px}.pphoto img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.psigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:10px}.psig{display:grid;gap:6px}.psig img{max-height:90px;background:#fff;border:1px solid var(--line);border-radius:8px}.sigpad{width:100%;height:120px;background:#fff;border:1px dashed var(--muted);border-radius:8px;touch-action:none}
.ic.pic{height:58px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.ic.pic img{object-position:top}
.ic.fuel{background:#fff1dc;color:#b46a00} .ic.mat{background:#e6efff;color:#1f63c6} .ic.tool{background:#ece8ff;color:#5b44c9}
.ic.car{background:#e3f5ec;color:#1f8a4c} .ic.food{background:#ffe8e6;color:#c23b31} .ic.soft{background:#e6f6fb;color:#0f7a99}
.ic.tax{background:#f1f1f1;color:#555} .ic.inc{background:#e3f5ec;color:#1f8a4c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic{filter:saturate(.9) brightness(.85)}}
.todo{display:flex;flex-direction:column;gap:8px}
.todo a{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:11px 14px;text-decoration:none;color:inherit}
.todo a.bad{border-left-color:var(--bad)} .todo a.info{border-left-color:var(--accent)}
.todo a b{font-weight:600}
.cap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0}
.cap .photo{width:100%;max-width:420px;border-radius:var(--radius);overflow:hidden;background:var(--panel);border:1px solid var(--line);min-height:160px;display:grid;place-items:center}
.cap .photo img,.cap .photo canvas{width:100%;display:block}
.result{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.result .top{display:flex;gap:14px;align-items:center}
.result .vendor{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.result .amount{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--bg);border-radius:12px;padding:9px 12px}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts b{font-weight:600}
.catpick{display:flex;gap:8px;flex-wrap:wrap}
.catpick button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.catpick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.morelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.morelist a{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:inherit}
.morelist a b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.morelist a span{font-size:13px;color:var(--muted)}
#tabbar{display:none}
.todo a svg,.btn svg{width:20px;height:20px;flex:none}
.todo a svg{color:var(--muted)}
.ic svg{width:22px;height:22px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  #tabbar a svg{width:24px;height:24px}
  #tabbar a.on{color:var(--accent);font-weight:600}
  #tabbar a.fab{color:#fff}
  #tabbar a.fab i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--accent);margin-top:-26px;box-shadow:0 6px 16px rgba(31,99,198,.35);border:4px solid var(--panel)}
  #tabbar a.fab span{color:var(--accent);font-weight:600}
  #tabbar .dot{position:absolute;top:0;right:22%;background:var(--amber);color:#1b1300;border-radius:99px;font-size:10px;padding:0 5px;font-weight:700}
  .split{grid-template-columns:1fr}
  main{padding:18px 14px 110px}
  .hero{grid-template-columns:1fr 1fr}
  .hero button.main{grid-column:1/-1;min-height:100px;flex-direction:row;align-items:center}
  .hero button.main svg{width:40px;height:40px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .val{font-size:22px}
  .head h1{font-size:26px}
  .head{gap:8px}
  .sheet-head{padding:10px 14px}
  .sheet-body{padding:14px}
  .toast{bottom:96px}
  .hide-m{display:none}
  .only-m{display:block} .only-d{display:none!important}
  html,body{overflow-x:hidden}
  body{font-size:16px}
  input,select,textarea{font-size:16px;padding:10px 12px;border-radius:10px}
  .btn{padding:10px 14px;border-radius:12px}
  .btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
  .card{border-radius:18px}
  .list,.tbl-wrap{border-radius:18px}
  /* Kopfzeile: Titel oben, Knöpfe als Reihe darunter */
  .head{margin-bottom:14px}
  .head h1{flex:1 1 100%;font-size:28px}
  .head > .btn{flex:1 1 auto;justify-content:center}
  /* Reiter als wischbare Leiste */
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:-14px;margin-right:-14px;padding:0 14px 2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:8px 15px}
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar input{max-width:none!important}
  /* Tabellen werden zu Karten */
  .tbl-wrap{overflow:visible}
  .tbl-wrap:not(.keep) table,.tbl-wrap:not(.keep) tbody,.tbl-wrap:not(.keep) tr,.tbl-wrap:not(.keep) td{display:block;width:auto!important}
  .tbl-wrap:not(.keep) thead{display:none}
  .tbl-wrap:not(.keep) tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl-wrap:not(.keep) tbody tr:last-child{border-bottom:0}
  .tbl-wrap:not(.keep) td{border:0;padding:2px 0;text-align:left!important}
  .tbl-wrap:not(.keep) td:empty{display:none}

function makeDb() {
  const store = new Map(); const subs = new Set(); let loaded = false;
  const notify = () => { for (const f of subs) try { f(); } catch (e) { console.warn(e); } };
  async function loadAll() {
    const all = []; for (let from = 0; ; from += 1000) { const { data, error } = await supa.from("docs").select("col,id,data").range(from, from + 999); if (error) throw error; all.push(...data); if (data.length < 1000) break; }
    store.clear(); for (const r of all) store.set(r.col + "/" + r.id, r.data); loaded = true; notify();
  }
  supa.channel("docs-live").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
    if (p.eventType === "DELETE") { if (p.old?.col) store.delete(p.old.col + "/" + p.old.id); else { loadAll(); return; } }
    else if (p.new?.col) store.set(p.new.col + "/" + p.new.id, p.new.data); notify();
  }).subscribe();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadAll().catch(() => { }); });
  const err = e => ({ code: /fetch|network/i.test(e?.message || "") ? "unavailable" : "invalid_argument", message: e?.message || String(e) });
  function doc(path) {
    const i = path.indexOf("/"); const col = path.slice(0, i), id = path.slice(i + 1);
    return {
      id, path,
      async get() { return { exists: store.has(path), data: () => store.get(path) }; },
      async set(data) { store.set(path, data); notify(); const { error } = await supa.from("docs").upsert({ col, id, data }); if (error) throw err(error); },
      async update(data) { const cur = store.get(path) || {}; return this.set({ ...cur, ...data }); },
      async delete() { store.delete(path); notify(); const { error } = await supa.from("docs").delete().eq("col", col).eq("id", id); if (error) throw err(error); },
      onSnapshot(next) { const f = () => { if (loaded) next({ exists: store.has(path), data: () => store.get(path) }); }; subs.add(f); f(); return () => subs.delete(f); },
    };

      path: c, doc: id => doc(c + "/" + (id || uid())),

    };

};
async function fileB64(file) { const u8 = new Uint8Array(await file.arrayBuffer()); let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function fileHash(file) { const h = await crypto.subtle.digest("SHA-256", await file.arrayBuffer()); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }

function itemNet(it) { return r2(parseNum(it.qty) * parseNum(it.price)); }
function salesTotals(doc) {
  const by = {}; let net = 0;
  for (const it of doc.items || []) { const n = itemNet(it); net += n; const v = doc.taxMode === "rc13b" ? 0 : Number(it.vat || 0); by[v] = (by[v] || 0) + n; }
  let tax = 0; for (const v in by) tax += r2(by[v] * Number(v) / 100);
  net = r2(net); tax = r2(tax);
  return { net, tax, gross: r2(net + tax), by };
}

const INCOME_KINDS = ["einnahme", "einnahmenminderung"];

/* Zahlungen eines Belegs: [{date, amount}] – fuer Ist-Versteuerung und EÜR */
function paymentsOf(d, gross) {

/* ---- Umsatzsteuer-Voranmeldung (Ist-Versteuerung: Umsatz bei Zahlung, Vorsteuer nach Belegdatum) ---- */
function ustvaCalc(from, to) { // ISO-Daten, inkl.
  const inR = d => d && d >= from && d <= to;

  const addSales = (lines, pays, gross, ref) => {
    for (const p of pays) { if (!inR(p.date) || !gross) continue; const ratio = p.amount / gross;
      for (const l of lines) { const v = l.vat, n = l.net * ratio; if (l.rc) K["60"] += n; else if (v === 19) K["81"] += n; else if (v === 7) K["86"] += n; else K["45"] += n; }
      src.push({ ...ref, date: p.date, amount: p.amount }); }
  };
  for (const d of S.sales.values()) {
    if (!(d.kind === "rechnung" || d.kind === "storno") || d.status === "entwurf") continue;
    const t = salesTotals(d); const lines = Object.entries(t.by).map(([v, n]) => ({ vat: Number(v), net: n, rc: d.taxMode === "rc13b" }));
    if (!d.items?.length && d.taxMode === "rc13b") lines.push({ vat: 0, net: Number(d.gross || 0), rc: true });
    addSales(lines, paymentsOf(d, t.gross || Number(d.gross || 0)), t.gross || Number(d.gross || 0), { t: "sales", id: d.id, label: (d.number || "Entwurf") + " " + salesName(d) });
  }
  for (const v of S.vouchers.values()) {
    if (v.status === "pruefen" || v.status === "claude" || v.status === "storniert") continue;
    const s = sgnV(v);
    if (INCOME_KINDS.includes(v.kind)) {
      const lines = (v.items || []).filter(i => CATS[i.cat]?.group === "einnahme").map(i => { const x = vItemSplit(i); return { vat: Number(i.vat), net: s * x.net, rc: i.cat === "RevenuesRC" }; });
      addSales(lines, paymentsOf(v, vGross(v)).map(p => ({ ...p, amount: p.amount })), vGross(v), { t: "vouchers", id: v.id, label: (v.number || "") + " " + vendorName(v) });
    } else if (inR(v.date)) {
      let vst = 0; for (const i of v.items || []) { const g = CATS[i.cat]?.group; if (g === "steuer" || g === "privat" || g === "neutral") continue; vst += s * vItemSplit(i).tax; }
      if (vst) { K["66"] += vst; src.push({ t: "vouchers", id: v.id, label: (v.number || "") + " " + vendorName(v), date: v.date, vst }); }
    }
  }
  for (const b of S.bank.values()) {
    if (!b.cat || b.link || !inR(b.date) || !b.vat) continue; const g = CATS[b.cat]?.group; const a = Math.abs(b.amount); const net = a / (1 + b.vat / 100); const tax = a - net;
    if (g === "einnahme") { const n = (b.amount > 0 ? 1 : -1) * net; if (b.vat === 19) K["81"] += n; else if (b.vat === 7) K["86"] += n; src.push({ t: "bank", id: b.id, label: b.partner || b.text || "Bankbuchung", date: b.date, amount: b.amount }); }
    else if (g === "ausgabe" || g === "anlage") { K["66"] += (b.amount < 0 ? 1 : -1) * tax; src.push({ t: "bank", id: b.id, label: b.partner || b.text || "Bankbuchung", date: b.date, vst: tax }); }
  }
  const k81 = Math.floor(K["81"] + 1e-9), k86 = Math.floor(K["86"] + 1e-9);
  const ust = r2(k81 * 0.19 + k86 * 0.07);
  const k66 = r2(K["66"]);
  return { k81, k86, k60: Math.floor(K["60"] + 1e-9), k45: Math.floor(K["45"] + 1e-9), ust81: r2(k81 * 0.19), ust86: r2(k86 * 0.07), k66, k83: r2(ust - k66), src };
}

/* ---- AfA ---- */
function afaFor(a, year, untilMonth = 12) { // Summe AfA im Jahr bis einschl. Monat
  if (a.schedule && a.schedule[year] != null) {
    const [sy, sm] = a.date.split("-").map(Number); const endY = sy + Math.floor((sm - 1 + a.months - 1) / 12); const endM = ((sm - 1 + a.months - 1) % 12) + 1;
    const first = year == sy ? sm : 1, last = year == endY ? endM : 12; const monthsInYear = Math.max(0, last - first + 1);
    const cnt = Math.max(0, Math.min(untilMonth, last) - first + 1); if (!monthsInYear) return 0;
    return cnt >= monthsInYear ? Number(a.schedule[year]) : r2(Number(a.schedule[year]) / monthsInYear * cnt);

  const [sy, sm] = a.date.split("-").map(Number); const start = sy * 12 + sm - 1; const end = start + a.months - 1; const monthly = Number(a.cost) / a.months;

  return r2(sum);

function euerCalc(year) {
  const y = String(year); const K = {}; const add = (k, v) => { if (!k) return; K[k] = (K[k] || 0) + v; };

    if (tax) add(income ? "140" : "185", tax);
  };
  for (const d of S.sales.values()) {
    if (!(d.kind === "rechnung" || d.kind === "storno") || d.status === "entwurf") continue;
    const t = salesTotals(d); const gross = t.gross || Number(d.gross || 0);
    for (const p of paymentsOf(d, gross)) { if (!p.date?.startsWith(y) || !gross) continue; const ratio = p.amount / gross;
      if (!d.items?.length) { post("RevenuesRC", gross * ratio, 0, true); continue; }
      for (const [v, n] of Object.entries(t.by)) { const vat = Number(v); post(d.taxMode === "rc13b" || vat === 0 ? "RevenuesRC" : "Revenues", n * ratio, r2(n * vat / 100) * ratio, true); } }
  }
  for (const v of S.vouchers.values()) {
    if (v.status === "pruefen" || v.status === "claude" || v.status === "storniert") continue; const s = sgnV(v); const income = INCOME_KINDS.includes(v.kind); const gross = vGross(v);
    for (const p of paymentsOf(v, gross)) { if (!p.date?.startsWith(y) || !gross) continue; const ratio = p.amount / gross;
      for (const i of v.items || []) { const x = vItemSplit(i); post(i.cat, s * x.net * ratio, s * x.tax * ratio, income); } }
  }

    if (!b.cat || b.link || !b.date?.startsWith(y)) continue; const c = CATS[b.cat]; if (!c) continue;
    const a = Math.abs(b.amount), sg = b.amount > 0 ? 1 : -1; const net = r2(a / (1 + (b.vat || 0) / 100)), tax = r2(a - net);

  const sumOut = r2(Object.entries(K).filter(([k]) => !["112", "103", "140", "122", "123", "165"].includes(k)).reduce((a, [, v]) => a + v, 0));
  return { K, sumIn, sumOut, profit: r2(sumIn - sumOut) };
}

  for (const d of S.sales.values()) if ((d.kind === "rechnung" || d.kind === "storno") && d.status !== "entwurf") addP(paymentsOf(d, docGross(d)), 1, inM);

/* ---- Stapel-/Ordner-Import: alles speichern, Doppelte überspringen, Claude liest aus ---- */
const BULK = { running: false, done: 0, total: 0, dup: 0, err: 0, added: 0 };
async function bulkImport(files) {
  if (!files.length) return; if (BULK.running) { toast("Ein Import läuft schon."); return; }
  Object.assign(BULK, { running: true, done: 0, total: files.length, dup: 0, err: 0, added: 0 }); location.hash = "belege"; render();
  for (const f of files) {
    try {
      const hash = await fileHash(f); if (findFileByHash(hash)) { BULK.dup++; }
      else {
        const up = await assets.upload(f); const v = blankVoucher(); v.status = "claude"; v.vendor = ""; v.items = [{ cat: "OtherExpenditure", vat: 19, gross: 0 }]; v.files = [{ id: up.id, name: f.name, type: f.type, hash }]; v.source = "ordner"; v.note = (f.webkitRelativePath || f.name).slice(0, 120); v.capturedAt = new Date().toISOString();
        if (/\.xml$/i.test(f.name) || /pdf/.test(f.type)) { try { const res = await extractVoucher(f); if (res) { Object.assign(v, res.fields); v.status = res.fields.status || "offen"; } } catch (e) { } }
        await put("vouchers", v.id, v); BULK.added++;
      }
    } catch (e) { console.warn(e); BULK.err++; }
    BULK.done++; if (BULK.done % 2 === 0) render();
  }
  BULK.running = false; render(); toast(`${BULK.added} Belege übernommen${BULK.dup ? `, ${BULK.dup} doppelte übersprungen` : ""}${BULK.err ? `, ${BULK.err} Fehler` : ""}. Claude liest sie beim nächsten Check aus.`, 7000);
}

    try { const att = await pdf.getAttachments(); if (att) for (const k in att) { const a = att[k]; if (/\.xml$/i.test(a.filename || k)) { einvXml = new TextDecoder().decode(a.content); break; } } } catch (e) { }
    for (let p = 1; p <= Math.min(pdf.numPages, maxPages); p++) { const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1 }); const sc = Math.min(2, 1600 / Math.max(vp.width, vp.height)); const v2 = page.getViewport({ scale: sc }); const cv = document.createElement("canvas"); cv.width = v2.width; cv.height = v2.height; await page.render({ canvasContext: cv.getContext("2d"), viewport: v2 }).promise; imgs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85))); }

  const pm = new Date(y, now.getMonth() - 1, 1); const prev = periodRange(pm.getFullYear(), pm.getMonth() + 1); const cur = periodRange(y, now.getMonth() + 1);
  const up = S.ustva.get(prev.key) ? 0 : ustvaCalc(prev.from, prev.to).k83; const uc = ustvaCalc(cur.from, todayISO()).k83;
  const ust = Math.max(0, r2((up > 0 ? up : 0) + (uc > 0 ? uc : 0)));

}

    const ds = arr.map(v => new Date(v.date).getTime()); const gaps = ds.slice(1).map((t, i) => (t - ds[i]) / 864e5).sort((a, b) => a - b); const med = gaps[Math.floor(gaps.length / 2)];

      case "file": { const k = el.dataset.k, k83 = Number(el.dataset.v); await put("ustva", k, { filedAt: todayISO(), k83 });

          Object.assign(v, { number: `UStVA-${k}`, date: `${k}-${String(new Date(y, mo, 0).getDate()).padStart(2, "0")}`, dueDate: dueISO < todayISO() ? todayISO() : dueISO, vendor: "Finanzamt Straubing", status: "offen", items: [{ cat: "VatPrepayments", vat: 0, gross: k83 }], note: `USt-Vorauszahlung ${MONTHS[mo - 1]} ${y}`, source: "app" }); await put("vouchers", v.id, v); toast(`Gemeldet. ${eur(k83)} bis ${fmtDate(v.dueDate)} ans Finanzamt überweisen – steht jetzt auf der Startseite.`, 7000); }

      case "saveAsset": { const a = UI.sheet.d; $$("[data-asf]", $("#sheet")).forEach(x => a[x.dataset.asf] = x.value); a.cost = parseNum(a.cost); a.months = parseInt(a.months, 10) || 36; if (!a.name) { toast("Bitte eine Bezeichnung eintragen."); break; } await put("assets", a.id, a); closeSheet(); break; }
      case "deleteAsset": if (!confirmInline(el, "Anlage löschen?")) break; await del("assets", UI.sheet.d.id); closeSheet(); break;
      case "saveSettings": { const d = {}; $$("[data-set]").forEach(x => d[x.dataset.set] = x.value); for (const k of ["nextInvoice", "nextQuote", "paymentDays"]) d[k] = parseInt(d[k], 10) || 0; if (d.kmRate !== undefined) d.kmRate = parseNum(d.kmRate) || 0.75; if (d.taxReserveRate !== undefined) d.taxReserveRate = parseNum(d.taxReserveRate) || 30; if (d.meterCalMonths !== undefined) d.meterCalMonths = parseInt(d.meterCalMonths, 10) || 12; await saveCompany(d); toast("Einstellungen gespeichert."); break; }
      case "pickLogo": $("#logoPick").click(); break;

      case "openTrip": e.preventDefault(); UI.sheet = { type: "trip", d: { ...S.trips.get(id) } }; renderSheet(); break;
      case "saveTrip": { const t = UI.sheet.d; $$("[data-tf]", $("#sheet")).forEach(x => t[x.dataset.tf] = x.value); t.km = parseNum(t.km); t.roundtrip = !!t.roundtrip; t.billable = !!t.billable; if (!t.km) { toast("Bitte die Kilometer eintragen."); break; } await put("trips", t.id, t); closeSheet(); toast("Fahrt gespeichert."); break; }
      case "deleteTrip": if (!confirmInline(el, "Fahrt löschen?")) break; await del("trips", UI.sheet.d.id); closeSheet(); break;
      case "addTrips": { const d = readSaleForm(); const trips = [...S.trips.values()].filter(t => t.billable && !t.billedIn && (!d.contactId || !t.contactId || t.contactId === d.contactId)).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        if (!trips.length) { toast("Keine offenen Fahrten für diesen Kunden im Fahrtenbuch."); break; }
        d.items = d.items.filter(i => i.desc || parseNum(i.price)); for (const t of trips) d.items.push({ desc: `Anfahrtspauschale ${fmtDate(t.date)}${t.to ? " – " + t.to : ""}${t.roundtrip ? " (Hin- und Rückweg)" : ""}`, qty: Number(t.km), unit: "Kilometer", price: tripRate(), vat: 19, tripId: t.id });
        renderSheet(); toast(trips.length === 1 ? "1 Fahrt übernommen." : `${trips.length} Fahrten übernommen.`); break; }
      case "toLogin": viewLogin("login"); break;
      case "saveGh": { const t = $("#gh-token").value.trim(); if (!/^(github_pat_|ghp_)/.test(t)) { IMP.ghErr = "Das sieht nicht wie ein GitHub-Token aus (beginnt mit github_pat_)."; render(); break; }
        S.gh = { token: t, repo: GH_REPO_DEFAULT }; try { const r = await gh.req(""); if (!r.ok) throw new Error("Repo labertal-belege nicht erreichbar (" + r.status + ")"); } catch (x) { S.gh = null; IMP.ghErr = x.message; render(); break; }
        IMP.ghErr = ""; await db.doc("cfg/github").set({ token: t, repo: GH_REPO_DEFAULT, savedAt: new Date().toISOString() }); postSW(); toast("GitHub verbunden."); render(); if (needsImport()) runImport(); break; }
      case "cqCat": UI.sheet.cq = UI.sheet.cq === el.dataset.cat ? "" : el.dataset.cat; $$("[data-act=cqCat]").forEach(b => b.classList.toggle("on", b.dataset.cat === UI.sheet.cq)); break;
      case "cqSave": { const st = UI.sheet; const d = st.d; const amt = parseNum($("#cq-amount")?.value); const pm = $("#cq-pm")?.value; const note = $("#cq-note")?.value || "";
        d.hint = { amount: amt || null, cat: st.cq || null, pay: pm, note }; if (amt) d.items = [{ cat: st.cq || "OtherExpenditure", vat: st.cq === "PrivateWithdrawal" ? 0 : 19, gross: r2(amt) }]; else if (st.cq) d.items[0].cat = st.cq;
        d.note = note; d.payMethod = pm === "ueberweisung" ? "ueberweisung" : pm; await put("vouchers", d.id, d); const q = st.queue; closeSheet(); toast("Beleg gespeichert – Claude prüft ihn."); if (q?.length) processQueue(q); break; }
      case "capNext": { const q = UI.sheet.queue; closeSheet(); if (q?.length) processQueue(q); break; }

      case "pickFolder": $("#folderPick").click(); break;
      case "logout": await supa.auth.signOut(); break;
    }
  } catch (err) { console.error(err); toast("Fehler: " + (err?.message || err)); }
});
function confirmInline(btn, msg) { if (btn.dataset.armed === "1") return true; const old = btn.textContent; btn.dataset.armed = "1"; btn.textContent = "Sicher? Nochmal tippen"; toast(msg, 4000); setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = old; } }, 4000); return false; }
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.inp === "search") { UI.search = el.value; scheduleRender(); return; }
  if (UI.sheet?.type === "job" && el.dataset.jp && el.tagName !== "SELECT") { pSet(UI.sheet.d, el.dataset.jp, el.value); if (/^(start|end|pause)$/.test(el.dataset.jp)) { const h = jobHours(UI.sheet.d); const x = $("#j-hours"); if (x) x.value = h != null ? fmtNum(h) + " Std." : ""; } return; }

});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "taxYear") { UI.taxYear = Number(el.value); UI.taxMonth = null; render(); return; }
  if (UI.sheet?.type === "protocol" && el.dataset.pp) {
    const d = UI.sheet.d; pSet(d, el.dataset.pp, el.value);
    if (el.dataset.pp === "contactId") { const c = S.contacts.get(el.value); d.address = c ? { name: c.name, street: c.street, zip: c.zip, city: c.city } : {}; if (!d.sign?.kName && c) d.sign = { ...(d.sign || {}), kName: unent(c.name) }; d.saleId = ""; }
    if (el.dataset.pp.startsWith("steps.") && d.status === "fertig") await pSaveDoc(d);
    if (el.tagName === "SELECT" || el.dataset.pp === "date") pRerender(); return;
  }
  if (UI.sheet?.type === "job" && el.dataset.jp) {
    const j = UI.sheet.d; pSet(j, el.dataset.jp, el.value);
    if (el.dataset.jp === "contactId") { const c = S.contacts.get(el.value); j.address = c ? { name: c.name, street: c.street, zip: c.zip, city: c.city } : {}; if (c && !j.sign?.kName) j.sign = { ...(j.sign || {}), kName: unent(c.name) }; j.saleId = ""; jRerender(); }
    else if (el.tagName === "SELECT") jRerender(); return;
  }

    const files = [...el.files]; el.value = ""; const j = UI.sheet.d; const kind = el.dataset.jphoto; toast(files.length > 1 ? `${files.length} Fotos werden hochgeladen …` : "Foto wird hochgeladen …", 15000);

    await jSaveDoc(j); jRerender(); toast("Gespeichert."); return;
  }
  if (UI.sheet?.type === "protocol" && el.dataset.pphoto != null) {
    const files = [...el.files]; el.value = ""; const d = UI.sheet.d; const ci = el.dataset.pphoto; toast("Foto wird hochgeladen …");
    for (const f of files) { const up = await assets.upload(f); d.photos = [...(d.photos || []), { id: up.id, name: f.name, type: f.type, cap: ci === "x" ? "" : `Messgerät – Stromkreis ${d.circuits[Number(ci)]?.no || ""}`, circuit: ci === "x" ? null : Number(ci) }]; }
    if (ci !== "x") { d.claudeRead = true; toast("Foto gespeichert. Claude trägt die Werte beim nächsten Check ein – oder du tippst sie selbst ein.", 6000); }
    await pSaveDoc(d); UI.sheet.isNew = false; pRerender(); return;
  }
  if (el.id === "s-contact") { if (el.value === "__new") { const back = UI.sheet; readSaleForm(); UI.sheet = { type: "contact", d: { id: uid(), name: "", isCustomer: true, isVendor: false, country: "DE" }, isNew: true, back }; renderSheet(); return; }
    const c = S.contacts.get(el.value); const d = readSaleForm(); if (c) { d.contactId = c.id; d.address = { name: c.name, street: c.street, zip: c.zip, city: c.city, country: c.country || "DE", customerNo: c.customerNo, vatId: c.vatId }; } renderSheet(); return; }
  if (el.id === "s-tax") { readSaleForm(); if (UI.sheet.d.taxMode === "rc13b") UI.sheet.d.items.forEach(i => i.vat = 0); else UI.sheet.d.items.forEach(i => { if (!Number(i.vat)) i.vat = 19; }); renderSheet(); return; }
  if (el.dataset.f === "vat" && UI.sheet?.type === "sale") { const d = readSaleForm(); $("#s-totals").innerHTML = totalsHtml(d, salesTotals(d)); return; }

  if (el.id === "folderPick" || (el.id === "filePick" && el.files.length > 3 && !UI.attach)) { const files = [...el.files].filter(f => /^(image\/|application\/pdf)|\.(pdf|jpe?g|png|heic|xml)$/i.test(f.type + " " + f.name)); el.value = ""; bulkImport(files); return; }

});
["dragover", "dragenter"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } }));
